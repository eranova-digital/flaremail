openapi: 3.1.0
info:
  title: Email Platform API
  version: 1.0.0
  description: |
    Version 1 of the email platform HTTP API.

    Errors use [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) Problem Details
    (`application/problem+json`).

    OpenAPI document: `GET /api/v1/openapi.json`
  license:
    name: Proprietary

servers:
  - url: /api/v1
    description: API v1 base path

tags:
  - name: Domains
  - name: Mailboxes
  - name: Labels
  - name: Messages
  - name: Drafts
  - name: Threads
  - name: Search
  - name: Attachments

security:
  - bearerAuth: []

paths:
  /domains:
    get:
      tags: [Domains]
      summary: List domains
      operationId: listDomains
      responses:
        "200":
          description: Domain list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Domain"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Domains]
      summary: Create domain
      operationId: createDomain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  example: example.com
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        default:
          $ref: "#/components/responses/Problem"

  /domains/{id}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    get:
      tags: [Domains]
      summary: Get domain
      operationId: getDomain
      responses:
        "200":
          description: Domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Domains]
      summary: Update domain
      operationId: updateDomain
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
                catchAllEnabled:
                  type: boolean
                catchAllMailboxId:
                  type: ["string", "null"]
                  format: uuid
      responses:
        "200":
          description: Updated domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Domains]
      summary: Delete domain
      description: Hard-deletes the domain, all mailboxes, messages, and R2 objects.
      operationId: deleteDomain
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /domains/{id}/validation-runs:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    get:
      tags: [Domains]
      summary: List domain validation runs
      operationId: listDomainValidationRuns
      responses:
        "200":
          description: Validation run history
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DomainValidationRunSummary"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Domains]
      summary: Start or return active domain validation run
      operationId: createDomainValidationRun
      responses:
        "200":
          description: Validation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainValidationRunDetail"
        default:
          $ref: "#/components/responses/Problem"

  /domains/{id}/validation-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Domains]
      summary: Get domain validation run detail
      operationId: getDomainValidationRun
      responses:
        "200":
          description: Validation run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainValidationRunDetail"
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes:
    get:
      tags: [Mailboxes]
      summary: List mailboxes
      operationId: listMailboxes
      responses:
        "200":
          description: Mailbox list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Mailbox"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Mailboxes]
      summary: Create mailbox
      operationId: createMailbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMailboxRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    get:
      tags: [Mailboxes]
      summary: Get mailbox
      operationId: getMailbox
      responses:
        "200":
          description: Mailbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Mailboxes]
      summary: Update mailbox
      operationId: updateMailbox
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
      responses:
        "200":
          description: Updated mailbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Mailboxes]
      summary: Delete mailbox
      description: Hard-deletes the mailbox, its messages, and R2 objects.
      operationId: deleteMailbox
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes/{mailboxId}/labels:
    parameters:
      - $ref: "#/components/parameters/MailboxId"
    get:
      tags: [Labels]
      summary: List labels
      operationId: listLabels
      responses:
        "200":
          description: Label list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Label"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Labels]
      summary: Create label
      operationId: createLabel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                color:
                  type: ["string", "null"]
      responses:
        "201":
          description: Created label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes/{mailboxId}/labels/{id}:
    parameters:
      - $ref: "#/components/parameters/MailboxId"
      - $ref: "#/components/parameters/UuidId"
    get:
      tags: [Labels]
      summary: Get label
      operationId: getLabel
      responses:
        "200":
          description: Label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Labels]
      summary: Update label
      operationId: updateLabel
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  type: ["string", "null"]
      responses:
        "200":
          description: Updated label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Labels]
      summary: Delete label
      operationId: deleteLabel
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /messages/send:
    post:
      tags: [Messages]
      summary: Send message
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCommandResponse"
        default:
          $ref: "#/components/responses/Problem"

  /messages/drafts:
    post:
      tags: [Drafts]
      summary: Create draft
      operationId: createDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftRequest"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCommandResponse"
        default:
          $ref: "#/components/responses/Problem"

  /messages/drafts/{id}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    patch:
      tags: [Drafts]
      summary: Update draft
      operationId: updateDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundMessageBody"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCommandResponse"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Drafts]
      summary: Delete draft
      operationId: deleteDraft
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /messages/drafts/{id}/send:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    post:
      tags: [Drafts]
      summary: Send draft
      operationId: sendDraft
      responses:
        "200":
          description: Draft sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCommandResponse"
        default:
          $ref: "#/components/responses/Problem"

  /messages/{id}/reply:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    post:
      tags: [Messages]
      summary: Reply to message
      operationId: replyToMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyRequest"
      responses:
        "201":
          description: Reply sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCommandResponse"
        default:
          $ref: "#/components/responses/Problem"

  /messages/{id}/forward:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    post:
      tags: [Messages]
      summary: Forward message
      operationId: forwardToMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardRequest"
      responses:
        "201":
          description: Forward sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCommandResponse"
        default:
          $ref: "#/components/responses/Problem"

  /messages/{id}/preview:
    parameters:
      - $ref: "#/components/parameters/UuidId"
      - $ref: "#/components/parameters/MailboxIdQuery"
    get:
      tags: [Messages]
      summary: Get message preview
      description: Returns DB metadata only (no R2 parse).
      operationId: getMessagePreview
      responses:
        "200":
          description: Message preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePreview"
        default:
          $ref: "#/components/responses/Problem"

  /messages/{id}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
      - $ref: "#/components/parameters/MailboxIdQuery"
    get:
      tags: [Messages]
      summary: Get message
      description: Parses the stored raw EML from R2.
      operationId: getMessage
      responses:
        "200":
          description: Full message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageFull"
        default:
          $ref: "#/components/responses/Problem"

  /messages/{id}/raw:
    parameters:
      - $ref: "#/components/parameters/UuidId"
      - $ref: "#/components/parameters/MailboxIdQuery"
    get:
      tags: [Messages]
      summary: Download raw message
      description: Returns the stored raw EML bytes from R2.
      operationId: downloadRawMessage
      responses:
        "200":
          description: Raw EML bytes
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /threads:
    get:
      tags: [Threads]
      summary: List threads
      operationId: listThreads
      parameters:
        - $ref: "#/components/parameters/MailboxIdQuery"
        - name: folder
          in: query
          schema:
            $ref: "#/components/schemas/ThreadFolder"
        - name: labelId
          in: query
          schema:
            type: string
            format: uuid
          description: When set, only threads with this label are returned.
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Thread page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadPage"
        default:
          $ref: "#/components/responses/Problem"

  /threads/{id}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
      - $ref: "#/components/parameters/MailboxIdQuery"
    get:
      tags: [Threads]
      summary: Get thread
      operationId: getThread
      responses:
        "200":
          description: Thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Threads]
      summary: Replace thread labels
      operationId: patchThreadLabels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labelIds]
              properties:
                labelIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Updated thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"
        default:
          $ref: "#/components/responses/Problem"

  /threads/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/UuidId"
      - $ref: "#/components/parameters/MailboxIdQuery"
      - name: includeBody
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: When true, includes full message text, html, and attachments for each message.
    get:
      tags: [Threads]
      summary: List thread messages
      operationId: listThreadMessages
      responses:
        "200":
          description: Messages in thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadMessagesResponse"
        default:
          $ref: "#/components/responses/Problem"

  /threads/{id}/{action}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
            - archive
            - trash
            - spam
            - restore
            - mark-read
            - mark-unread
            - star
            - unstar
      - $ref: "#/components/parameters/MailboxIdQuery"
    post:
      tags: [Threads]
      summary: Run thread command
      operationId: runThreadAction
      responses:
        "200":
          description: Updated thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"
        default:
          $ref: "#/components/responses/Problem"

  /search:
    post:
      tags: [Search]
      summary: Search messages
      operationId: searchMessages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
        default:
          $ref: "#/components/responses/Problem"

  /attachments/{id}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    get:
      tags: [Attachments]
      summary: Download attachment
      description: Inbound messages and outbound drafts/sent messages.
      operationId: downloadAttachment
      responses:
        "200":
          description: Attachment bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MailboxId:
      name: mailboxId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MailboxIdQuery:
      name: mailboxId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    Problem:
      description: RFC 9457 problem response
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type URI
          example: /api/v1/problems/validation-error
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Field 'mailboxId' is required
        instance:
          type: string
          format: uri-reference
          example: /api/v1/messages/send
        code:
          type: string
          description: Application-specific error code
          example: validation-error

    Domain:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        isActive:
          type: boolean
        catchAllEnabled:
          type: boolean
        catchAllMailboxId:
          type: ["string", "null"]
          format: uuid
        readiness:
          $ref: "#/components/schemas/DomainReadinessSummary"

    DomainReadinessSummary:
      type: object
      properties:
        badge:
          type: ["string", "null"]
          enum: ["checking", "fail", "healthy", "unhealthy"]
        latestRunId:
          type: ["string", "null"]
          format: uuid
        latestRunStartedAt:
          type: ["string", "null"]
          format: date-time
        latestRunFinishedAt:
          type: ["string", "null"]
          format: date-time

    DomainValidationRunSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [checking, completed]
        badge:
          type: string
          enum: [checking, fail, healthy, unhealthy]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time

    DomainValidationCheck:
      type: object
      properties:
        checkKey:
          type: string
          enum: [mx, dmarc_rua, loop_send, loop_receive]
        tier:
          type: string
          enum: [critical, advisory]
        status:
          type: string
          enum: [pending, passed, failed, skipped]
        code:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        checkedAt:
          type: ["string", "null"]
          format: date-time

    DomainValidationLogEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        level:
          type: string
          enum: [info, warning, error]
        stage:
          type: string
          enum: [dns, send, receive, summary]
        code:
          type: ["string", "null"]
        message:
          type: string
        createdAt:
          type: string
          format: date-time

    DomainValidationRunDetail:
      allOf:
        - $ref: "#/components/schemas/DomainValidationRunSummary"
        - type: object
          properties:
            domainId:
              type: string
              format: uuid
            receiveDeadlineAt:
              type: ["string", "null"]
              format: date-time
            checks:
              type: array
              items:
                $ref: "#/components/schemas/DomainValidationCheck"
            logs:
              type: array
              items:
                $ref: "#/components/schemas/DomainValidationLogEvent"

    Mailbox:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domainId:
          type: string
          format: uuid
        address:
          type: string
        type:
          type: string
          enum: [primary, secondary, shared, alias, system, blackhole]
        aliasTargetId:
          type: ["string", "null"]
          format: uuid
        aliasTargetAddress:
          type: ["string", "null"]
        isActive:
          type: boolean
        isSystemManaged:
          type: boolean
          description: True for platform-provisioned addresses that cannot be edited or deleted.

    CreateMailboxRequest:
      type: object
      required: [address, domainId, type]
      properties:
        address:
          type: string
        domainId:
          type: string
          format: uuid
        type:
          type: string
          enum: [primary, secondary, shared, alias]
        aliasTargetId:
          type: string
          format: uuid
        aliasTargetAddress:
          type: string

    Label:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mailboxId:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: ["string", "null"]

    EmailAddress:
      oneOf:
        - type: string
        - type: object
          required: [email]
          properties:
            email:
              type: string
            name:
              type: string

    OutboundAttachmentInput:
      type: object
      required: [filename, mimeType, content]
      properties:
        filename:
          type: string
        mimeType:
          type: string
        content:
          type: string
          description: Base64-encoded file bytes.
        disposition:
          type: string
          enum: [attachment, inline]
        contentId:
          type: string

    OutboundMessageBody:
      type: object
      required: [to, subject]
      properties:
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        subject:
          type: string
        text:
          type: string
        html:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/OutboundAttachmentInput"

    SendMessageRequest:
      allOf:
        - $ref: "#/components/schemas/OutboundMessageBody"
        - type: object
          required: [mailboxId]
          properties:
            mailboxId:
              type: string
              format: uuid

    CreateDraftRequest:
      allOf:
        - $ref: "#/components/schemas/SendMessageRequest"
        - type: object
          properties:
            threadId:
              type: string
              format: uuid
            inReplyToMessageId:
              type: string
              format: uuid
            replyAll:
              type: boolean
              default: false
              description: >
                When replying via draft, include all visible thread participants
                (From, To, Cc, Reply-To) except the sending mailbox. Ignored when
                explicit `to` recipients are provided.

    ReplyRequest:
      type: object
      required: [mailboxId]
      properties:
        mailboxId:
          type: string
          format: uuid
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        subject:
          type: string
          description: >
            Optional. When omitted, defaults to `Re: <parent subject>`. Does not
            prepend another `Re:` when the parent subject already starts with `Re:`.
        text:
          type: string
        html:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/OutboundAttachmentInput"
        replyAll:
          type: boolean
          default: false

    ForwardRequest:
      type: object
      required: [mailboxId, to]
      properties:
        mailboxId:
          type: string
          format: uuid
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        subject:
          type: string
          description: >
            Optional. When omitted, defaults to `Fwd: <parent subject>`. Does not
            prepend another `Fwd:` when the parent subject already starts with `Fwd:`.
        text:
          type: string
        html:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/OutboundAttachmentInput"
        includeAttachments:
          type: boolean
          default: true
          description: When true, copies attachments from the forwarded message.
        includeQuotedBody:
          type: boolean
          default: true
          description: >
            When true, appends a quoted copy of the parent message below the optional
            intro text. Set false when the client already included the quote in `text`/`html`.

    ThreadMessagePreview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: ["string", "null"]
        preview:
          type: ["string", "null"]
        from:
          type: string
        to:
          type: string
        cc:
          type: ["string", "null"]
        bcc:
          type: ["string", "null"]
        direction:
          type: string
          enum: [inbound, outbound]
        sendStatus:
          type: ["string", "null"]
        hasHtml:
          type: boolean
        hasAttachments:
          type: boolean
        sentAt:
          type: ["string", "null"]
          format: date-time
        receivedAt:
          type: string
          format: date-time
        inReplyTo:
          type: ["string", "null"]
          format: uuid
          description: Parent message id within the thread, when this message is a reply.
        text:
          type: ["string", "null"]
          description: Present when includeBody=true on list thread messages.
        html:
          type: ["string", "null"]
          description: Present when includeBody=true on list thread messages.
        attachments:
          type: array
          description: Present when includeBody=true on list thread messages.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              filename:
                type: ["string", "null"]
              mimeType:
                type: string
              sizeBytes:
                type: integer
              disposition:
                type: ["string", "null"]
              contentId:
                type: ["string", "null"]
        sentBy:
          type: ["object", "null"]
          description: >
            Present only when viewing a shared mailbox. Internal-only identity of the
            user who sent the outbound message.
          properties:
            accountId:
              type: string
              format: uuid
            loginIdentifier:
              type: string
              format: email
            displayName:
              type: string
            profilePicture:
              $ref: "#/components/schemas/ProfilePicture"

    ThreadMessagesResponse:
      type: object
      properties:
        thread:
          $ref: "#/components/schemas/Thread"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ThreadMessagePreview"

    SendCommandResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        rfcMessageId:
          type: string
        status:
          type: string
          enum: [draft, sending, sent, failed]

    MessagePreview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        subject:
          type: ["string", "null"]
        preview:
          type: ["string", "null"]
        from:
          type: string
        to:
          type: string
        cc:
          type: ["string", "null"]
        bcc:
          type: ["string", "null"]
        direction:
          type: string
          enum: [inbound, outbound]
        sendStatus:
          type: ["string", "null"]
        hasHtml:
          type: boolean
        hasAttachments:
          type: boolean
        sentAt:
          type: ["string", "null"]
          format: date-time
        receivedAt:
          type: string
          format: date-time

    MessageFull:
      allOf:
        - $ref: "#/components/schemas/MessagePreview"
        - type: object
          properties:
            text:
              type: ["string", "null"]
            html:
              type: ["string", "null"]
            bcc:
              type: ["string", "null"]
            rfcMessageId:
              type: string
            headers:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  value:
                    type: string
            attachments:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  filename:
                    type: ["string", "null"]
                  mimeType:
                    type: string
                  sizeBytes:
                    type: integer

    ThreadFolder:
      type: string
      enum: [inbox, spam, trash, archived, drafts, sent]

    Thread:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: ["string", "null"]
        preview:
          type: ["string", "null"]
        lastMessageAt:
          type: string
          format: date-time
        messageCount:
          type: integer
        isRead:
          type: boolean
        isStarred:
          type: boolean
        folder:
          $ref: "#/components/schemas/ThreadFolder"
        labelIds:
          type: array
          items:
            type: string
            format: uuid
        sender:
          type: ["string", "null"]
          description: From header of the latest message in the thread.
        participants:
          type: array
          description: Unique participant email addresses in the thread, excluding the viewing mailbox.
          items:
            type: string
            format: email
        seenBy:
          type: array
          description: >
            Present only when viewing a shared mailbox. List of users who have opened
            the thread since the latest message.
          items:
            $ref: "#/components/schemas/SeenByViewer"

    ProfilePicture:
      type: ["object", "null"]
      properties:
        updatedAt:
          type: string
          format: date-time

    SeenByViewer:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        loginIdentifier:
          type: string
          format: email
        displayName:
          type: string
        profilePicture:
          $ref: "#/components/schemas/ProfilePicture"
        seenAt:
          type: string
          format: date-time

    ThreadPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Thread"
        nextCursor:
          type: ["string", "null"]

    SearchRequest:
      type: object
      required: [mailboxId, query]
      properties:
        mailboxId:
          type: string
          format: uuid
        query:
          type: string
        cursor:
          type: ["string", "null"]
        limit:
          type: integer
          minimum: 1
          maximum: 100

    SearchPage:
      type: object
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/MessagePreview"
              - type: object
                properties:
                  threadId:
                    type: string
                    format: uuid
        nextCursor:
          type: ["string", "null"]
