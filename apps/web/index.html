<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Flaremail</title>
		<script>
			(function () {
				try {
					var themeKey = "flaremail:theme";
					var preference = localStorage.getItem(themeKey);
					if (
						preference !== "light" &&
						preference !== "dark" &&
						preference !== "system"
					) {
						preference = "system";
					}
					var dark =
						preference === "dark" ||
						(preference === "system" &&
							window.matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.classList.toggle("dark", dark);
					document.documentElement.style.colorScheme = dark ? "dark" : "light";

					var localeKey = "flaremail:locale";
					var locale = localStorage.getItem(localeKey);
					var supported = {
						"en-US": 1,
						"ro-RO": 1,
						"es-ES": 1,
						"de-DE": 1,
						"fr-FR": 1,
						"pt-BR": 1,
						"it-IT": 1,
						"pl-PL": 1,
						"tr-TR": 1,
						"ja-JP": 1,
						"ko-KR": 1,
						"zh-CN": 1,
						"ru-RU": 1,
					};
					var languageMap = {
						en: "en-US",
						ro: "ro-RO",
						es: "es-ES",
						de: "de-DE",
						fr: "fr-FR",
						pt: "pt-BR",
						it: "it-IT",
						pl: "pl-PL",
						tr: "tr-TR",
						ja: "ja-JP",
						ko: "ko-KR",
						zh: "zh-CN",
						ru: "ru-RU",
					};
					if (!supported[locale]) {
						var languages = navigator.languages || [navigator.language];
						locale = "en-US";
						for (var i = 0; i < languages.length; i++) {
							var tag = String(languages[i] || "")
								.trim()
								.replace(/_/g, "-");
							if (supported[tag]) {
								locale = tag;
								break;
							}
							var lang = tag.split("-")[0].toLowerCase();
							if (languageMap[lang]) {
								locale = languageMap[lang];
								break;
							}
						}
					}
					document.documentElement.lang = locale;
				} catch (_) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
