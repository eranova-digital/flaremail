openapi: 3.1.0
info:
  title: Flaremail API
  version: 1.0.0
  description: |
    HTTP API for Flaremail, self-hosted email on Cloudflare. Production clients
    call the **gate** hostname; gate proxies `/api/*` and `/health` to **core**.

    Versioned prefix: `/api/v1`. Live spec: `GET /api/v1/openapi.json`
    (`info.version` is the product version from root `package.json`).

    Errors use RFC 9457 Problem Details (`application/problem+json`). List
    endpoints use cursor pagination (`limit` default 50, max 100;
    `nextCursor` is null on the last page) unless noted.

    Auth is a signed-in session cookie **or** an API key Bearer token. Some
    security operations are session-only and reject API keys.
  license:
    name: Proprietary

servers:
  - url: /api/v1
    description: API v1 base path (relative to the gate origin)

tags:
  - name: Meta
    description: Spec, liveness, and first-run bootstrap
  - name: Auth
    description: Sign-in, profile, MFA, passkeys, sessions, and recovery
  - name: Accounts
    description: Account management, invites, grants, and assignments
  - name: API Keys
    description: Session-only API key create, list, and revoke
  - name: Domains
  - name: Mailboxes
  - name: Identities
  - name: Labels
  - name: Templates
    description: Reusable HTML compose templates
  - name: System Templates
    description: Instance transactional email HTML
  - name: Messages
  - name: Drafts
  - name: Threads
  - name: Search
  - name: Attachments
  - name: BIMI
  - name: Instance
    description: Organization settings
  - name: Logs
  - name: OIDC

security:
  - sessionCookie: []
  - bearerAuth: []

paths:
  /openapi.json:
    get:
      tags: [Meta]
      summary: OpenAPI document
      description: |
        Unauthenticated. `info.version` is replaced at serve time with the
        product version from root `package.json`.
      operationId: getOpenApiDocument
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /health:
    get:
      tags: [Meta]
      summary: Liveness
      description: |
        Unauthenticated liveness and version. The same payload is also served
        at origin `/health` (not under `/api/v1`) for gate health checks.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Liveness payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bootstrap:
    post:
      tags: [Meta]
      summary: Bootstrap the intendant
      description: |
        Unauthenticated first-run. Creates the intendant account when none
        exists and returns the generated password once. Subsequent calls
        return `{ created: false }` without revealing credentials.
        Rate-limited.
      operationId: bootstrapIntendant
      security: []
      responses:
        "200":
          description: Bootstrap result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResult"
        default:
          $ref: "#/components/responses/Problem"

  /auth/sign-in:
    post:
      tags: [Auth]
      summary: Sign in
      description: |
        Unauthenticated. Returns a session cookie, or `{ requiresMfa: true,
        mfaToken }` when MFA is enabled. Rate-limited by IP and email.
      operationId: signIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  description: Login identifier (mailbox address, or `intendant`)
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Session established, or MFA challenge
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "`flaremail_session` when MFA is not required"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/MfaChallenge"
        default:
          $ref: "#/components/responses/Problem"

  /auth/sign-out:
    post:
      tags: [Auth]
      summary: Sign out
      description: Clears the current session cookie when present.
      operationId: signOut
      security: []
      responses:
        "200":
          description: Signed out
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cleared `flaremail_session` when a token was present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /auth/me:
    get:
      tags: [Auth]
      summary: Current account
      operationId: getMe
      responses:
        "200":
          description: Signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Auth]
      summary: Update own profile
      description: |
        Recovery email cannot be changed here — use the recovery-email
        endpoints. Locked profile fields are ignored.
      operationId: updateMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfProfileUpdate"
      responses:
        "200":
          description: Updated account detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDetail"
        default:
          $ref: "#/components/responses/Problem"

  /auth/me/profile-picture:
    put:
      tags: [Auth]
      summary: Upload own profile picture
      operationId: uploadMyProfilePicture
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated picture metadata
          content:
            application/json:
              schema:
                type: object
                required: [profilePicture]
                properties:
                  profilePicture:
                    $ref: "#/components/schemas/ProfilePicture"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Auth]
      summary: Delete own profile picture
      operationId: deleteMyProfilePicture
      responses:
        "200":
          description: Picture removed
          content:
            application/json:
              schema:
                type: object
                required: [profilePicture]
                properties:
                  profilePicture:
                    type: "null"
        default:
          $ref: "#/components/responses/Problem"

  /auth/invite-preview:
    get:
      tags: [Auth]
      summary: Preview an invite
      description: Unauthenticated. Rate-limited by invite code.
      operationId: previewInvite
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        default:
          $ref: "#/components/responses/Problem"

  /auth/activate:
    post:
      tags: [Auth]
      summary: Activate an invite
      description: Sets the password, optional profile fields, and signs in. Rate-limited.
      operationId: activateInvite
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateInviteRequest"
      responses:
        "200":
          description: Activated and signed in
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "`flaremail_session`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        default:
          $ref: "#/components/responses/Problem"

  /auth/reset-preview:
    get:
      tags: [Auth]
      summary: Preview a password-reset code
      description: Unauthenticated. Rate-limited by code.
      operationId: previewPasswordReset
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Address the code belongs to
          content:
            application/json:
              schema:
                type: object
                required: [address]
                properties:
                  address:
                    type: string
        default:
          $ref: "#/components/responses/Problem"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password-reset email
      description: |
        Always returns `{ ok: true }` to avoid account enumeration. Rate-limited.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  type: string
                  description: Mailbox address or login identifier
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        default:
          $ref: "#/components/responses/Problem"

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with a code
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, password]
              properties:
                code:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        default:
          $ref: "#/components/responses/Problem"

  /auth/recovery-email/send:
    post:
      tags: [Auth]
      summary: Send recovery-email verification code
      description: Session-only.
      operationId: sendRecoveryEmailCode
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        default:
          $ref: "#/components/responses/Problem"

  /auth/recovery-email/verify:
    post:
      tags: [Auth]
      summary: Verify recovery email
      description: Session-only.
      operationId: verifyRecoveryEmail
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
      responses:
        "200":
          description: Recovery email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        default:
          $ref: "#/components/responses/Problem"

  /auth/sessions:
    get:
      tags: [Auth]
      summary: List own sessions
      description: Session-only.
      operationId: listMySessions
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionInfo"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Auth]
      summary: Revoke own sessions
      description: |
        Session-only. By default keeps the current session. Pass
        `includeCurrent=true` to sign out everywhere.
      operationId: revokeMySessions
      security:
        - sessionCookie: []
      parameters:
        - name: includeCurrent
          in: query
          schema:
            type: string
            enum: ["true"]
      responses:
        "200":
          description: Sessions revoked
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cleared cookie when the current session was revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevokeResponse"
        default:
          $ref: "#/components/responses/Problem"

  /auth/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    delete:
      tags: [Auth]
      summary: Revoke one of own sessions
      description: Session-only. Clears the cookie when revoking the current session.
      operationId: revokeMySession
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session revoked
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cleared cookie when this was the current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevokeResponse"
        default:
          $ref: "#/components/responses/Problem"

  /auth/intendant/regenerate-password:
    post:
      tags: [Auth]
      summary: Regenerate the intendant password
      description: |
        Intendant only. Returns a new random password and revokes all
        intendant sessions. TOTP `code` is required when MFA is enabled.
        Session-only.
      operationId: regenerateIntendantPassword
      security:
        - sessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: TOTP code when MFA is enabled
      responses:
        "200":
          description: New password (shown once)
          content:
            application/json:
              schema:
                type: object
                required: [password]
                properties:
                  password:
                    type: string
        default:
          $ref: "#/components/responses/Problem"

  /domains:
    get:
      tags: [Domains]
      summary: List domains
      operationId: listDomains
      responses:
        "200":
          description: Domain list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Domain"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Domains]
      summary: Create domain
      operationId: createDomain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  example: example.com
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        default:
          $ref: "#/components/responses/Problem"

  /domains/{id}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    get:
      tags: [Domains]
      summary: Get domain
      operationId: getDomain
      responses:
        "200":
          description: Domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Domains]
      summary: Update domain
      operationId: updateDomain
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
                catchAllEnabled:
                  type: boolean
                catchAllMailboxId:
                  type: ["string", "null"]
                  format: uuid
      responses:
        "200":
          description: Updated domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Domains]
      summary: Delete domain
      description: Hard-deletes the domain, all mailboxes, messages, and R2 objects.
      operationId: deleteDomain
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /domains/{id}/validation-runs:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    get:
      tags: [Domains]
      summary: List domain validation runs
      operationId: listDomainValidationRuns
      responses:
        "200":
          description: Validation run history
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DomainValidationRunSummary"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Domains]
      summary: Start or return active domain validation run
      operationId: createDomainValidationRun
      responses:
        "200":
          description: Validation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainValidationRunDetail"
        default:
          $ref: "#/components/responses/Problem"

  /domains/{id}/validation-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Domains]
      summary: Get domain validation run detail
      operationId: getDomainValidationRun
      responses:
        "200":
          description: Validation run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainValidationRunDetail"
        default:
          $ref: "#/components/responses/Problem"

  /domains/{id}/validation-runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/UuidId"
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Domains]
      summary: Cancel an in-progress domain validation run
      operationId: cancelDomainValidationRun
      responses:
        "200":
          description: Cancelled validation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainValidationRunDetail"
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes:
    get:
      tags: [Mailboxes]
      summary: List mailboxes
      operationId: listMailboxes
      responses:
        "200":
          description: Mailbox list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Mailbox"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Mailboxes]
      summary: Create mailbox
      operationId: createMailbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMailboxRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    get:
      tags: [Mailboxes]
      summary: Get mailbox
      operationId: getMailbox
      responses:
        "200":
          description: Mailbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Mailboxes]
      summary: Update mailbox
      operationId: updateMailbox
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
                  description: Managers cannot change mailbox active state.
                personalIdentityAllowance:
                  type: boolean
                  description: >
                    Shared mailboxes only. When true, senders may select
                    identities owned by their primary mailbox while composing
                    from this mailbox.
                identityExport:
                  type: boolean
                  description: >
                    Shared mailboxes only. When true, this mailbox's identities
                    may be selected when sending from other mailboxes the
                    account can access.
      responses:
        "200":
          description: Updated mailbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Mailboxes]
      summary: Delete mailbox
      description: Hard-deletes the mailbox, its messages, and R2 objects.
      operationId: deleteMailbox
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /identities:
    get:
      tags: [Identities]
      summary: List account identities for settings
      description: >
        Own (primary mailbox) identities, the instance default identity, and
        identities from shared mailboxes the account can access.
      operationId: listAccountIdentities
      responses:
        "200":
          description: Grouped identities overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountIdentitiesOverview"
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes/{mailboxId}/identities:
    parameters:
      - name: mailboxId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Identities]
      summary: List mailbox identities
      operationId: listMailboxIdentities
      responses:
        "200":
          description: Identities and manage capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityListResponse"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Identities]
      summary: Create mailbox identity
      operationId: createMailboxIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityInput"
      responses:
        "201":
          description: Created identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes/{mailboxId}/identities/available:
    parameters:
      - name: mailboxId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Identities]
      summary: List identities available when composing from a mailbox
      operationId: listAvailableIdentities
      responses:
        "200":
          description: Selectable identities
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Identity"
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes/{mailboxId}/identities/{id}:
    parameters:
      - name: mailboxId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/UuidId"
    patch:
      tags: [Identities]
      summary: Update mailbox identity
      operationId: updateMailboxIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityPatch"
      responses:
        "200":
          description: Updated identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Identities]
      summary: Delete mailbox identity
      operationId: deleteMailboxIdentity
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes/{mailboxId}/labels:
    parameters:
      - $ref: "#/components/parameters/MailboxId"
    get:
      tags: [Labels]
      summary: List labels
      operationId: listLabels
      responses:
        "200":
          description: Label list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Label"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Labels]
      summary: Create label
      operationId: createLabel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                color:
                  type: ["string", "null"]
      responses:
        "201":
          description: Created label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        default:
          $ref: "#/components/responses/Problem"

  /mailboxes/{mailboxId}/labels/{id}:
    parameters:
      - $ref: "#/components/parameters/MailboxId"
      - $ref: "#/components/parameters/UuidId"
    get:
      tags: [Labels]
      summary: Get label
      operationId: getLabel
      responses:
        "200":
          description: Label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Labels]
      summary: Update label
      operationId: updateLabel
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  type: ["string", "null"]
      responses:
        "200":
          description: Updated label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Labels]
      summary: Delete label
      operationId: deleteLabel
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /messages/send:
    post:
      tags: [Messages]
      summary: Send message
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCommandResponse"
        default:
          $ref: "#/components/responses/Problem"

  /messages/drafts:
    get:
      tags: [Drafts]
      summary: List draft messages
      description: >
        Returns all outbound messages with send status `draft` visible to the
        mailbox, including reply drafts on non-draft threads. `composeOnly` is
        true when the parent thread is parked in the drafts folder (new compose
        with no non-draft mail yet).
      operationId: listDrafts
      parameters:
        - $ref: "#/components/parameters/MailboxIdQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Draft message page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Drafts]
      summary: Create draft
      operationId: createDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftRequest"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCommandResponse"
        default:
          $ref: "#/components/responses/Problem"

  /messages/drafts/{id}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    patch:
      tags: [Drafts]
      summary: Update draft
      operationId: updateDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundMessageBody"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCommandResponse"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Drafts]
      summary: Delete draft
      operationId: deleteDraft
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /messages/drafts/{id}/send:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    post:
      tags: [Drafts]
      summary: Send draft
      operationId: sendDraft
      responses:
        "200":
          description: Draft sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCommandResponse"
        default:
          $ref: "#/components/responses/Problem"

  /messages/{id}/reply:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    post:
      tags: [Messages]
      summary: Reply to message
      operationId: replyToMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyRequest"
      responses:
        "201":
          description: Reply sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCommandResponse"
        default:
          $ref: "#/components/responses/Problem"

  /messages/{id}/forward:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    post:
      tags: [Messages]
      summary: Forward message
      operationId: forwardToMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardRequest"
      responses:
        "201":
          description: Forward sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCommandResponse"
        default:
          $ref: "#/components/responses/Problem"

  /messages/{id}/preview:
    parameters:
      - $ref: "#/components/parameters/UuidId"
      - $ref: "#/components/parameters/MailboxIdQuery"
    get:
      tags: [Messages]
      summary: Get message preview
      description: Returns DB metadata only (no R2 parse).
      operationId: getMessagePreview
      responses:
        "200":
          description: Message preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePreview"
        default:
          $ref: "#/components/responses/Problem"

  /messages/{id}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
      - $ref: "#/components/parameters/MailboxIdQuery"
    get:
      tags: [Messages]
      summary: Get message
      description: Parses the stored raw EML from R2.
      operationId: getMessage
      responses:
        "200":
          description: Full message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageFull"
        default:
          $ref: "#/components/responses/Problem"

  /messages/{id}/raw:
    parameters:
      - $ref: "#/components/parameters/UuidId"
      - $ref: "#/components/parameters/MailboxIdQuery"
    get:
      tags: [Messages]
      summary: Download raw message
      description: Returns the stored raw EML bytes from R2.
      operationId: downloadRawMessage
      responses:
        "200":
          description: Raw EML bytes
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /threads:
    get:
      tags: [Threads]
      summary: List threads
      operationId: listThreads
      parameters:
        - $ref: "#/components/parameters/MailboxIdQuery"
        - name: folder
          in: query
          schema:
            $ref: "#/components/schemas/ThreadFolder"
        - name: labelId
          in: query
          schema:
            type: string
            format: uuid
          description: When set, only threads with this label are returned.
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Thread page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadPage"
        default:
          $ref: "#/components/responses/Problem"

  /threads/{id}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
      - $ref: "#/components/parameters/MailboxIdQuery"
    get:
      tags: [Threads]
      summary: Get thread
      operationId: getThread
      responses:
        "200":
          description: Thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Threads]
      summary: Replace thread labels
      operationId: patchThreadLabels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labelIds]
              properties:
                labelIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Updated thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"
        default:
          $ref: "#/components/responses/Problem"

  /threads/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/UuidId"
      - $ref: "#/components/parameters/MailboxIdQuery"
      - name: includeBody
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: When true, includes full message text, html, and attachments for each message.
    get:
      tags: [Threads]
      summary: List thread messages
      operationId: listThreadMessages
      responses:
        "200":
          description: Messages in thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadMessagesResponse"
        default:
          $ref: "#/components/responses/Problem"

  /threads/{id}/{action}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
            - archive
            - trash
            - spam
            - restore
            - mark-read
            - mark-unread
            - star
            - unstar
      - $ref: "#/components/parameters/MailboxIdQuery"
    post:
      tags: [Threads]
      summary: Run thread command
      operationId: runThreadAction
      responses:
        "200":
          description: Updated thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"
        default:
          $ref: "#/components/responses/Problem"

  /search:
    post:
      tags: [Search]
      summary: Search messages
      operationId: searchMessages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
        default:
          $ref: "#/components/responses/Problem"

  /attachments/{id}:
    parameters:
      - $ref: "#/components/parameters/UuidId"
    get:
      tags: [Attachments]
      summary: Download attachment
      description: Inbound messages and outbound drafts/sent messages.
      operationId: downloadAttachment
      responses:
        "200":
          description: Attachment bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /bimi/{domain}/logo:
    parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
        description: Publishing BIMI domain (lowercase).
      - name: size
        in: query
        required: false
        schema:
          type: string
          enum: [small, large]
          default: small
      - name: v
        in: query
        required: false
        schema:
          type: string
        description: Cache-busting token (typically logoUpdatedAt ISO string).
    get:
      tags: [BIMI]
      summary: Download BIMI logo
      description: >
        Auth-gated WebP logo for a publishing BIMI domain. Requires a signed-in
        session or an API key with `bimi:read`. Returns 404 when the domain has
        no found logo cache entry.
      operationId: getBimiLogo
      responses:
        "200":
          description: BIMI logo WebP
          content:
            image/webp:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /oidc-clients:
    get:
      tags: [OIDC]
      summary: List OIDC clients
      operationId: listOidcClients
      responses:
        "200":
          description: OIDC client list
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [OIDC]
      summary: Create OIDC client
      operationId: createOidcClient
      responses:
        "201":
          description: Created client (clientSecret returned once when confidential)
        default:
          $ref: "#/components/responses/Problem"

  /oidc-clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [OIDC]
      summary: Get OIDC client
      operationId: getOidcClient
      responses:
        "200":
          description: OIDC client
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [OIDC]
      summary: Update OIDC client
      operationId: updateOidcClient
      responses:
        "200":
          description: Updated client
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [OIDC]
      summary: Delete OIDC client
      operationId: deleteOidcClient
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /oidc-clients/{id}/regenerate-secret:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [OIDC]
      summary: Regenerate OIDC client secret
      operationId: regenerateOidcClientSecret
      responses:
        "200":
          description: New secret (once)
        default:
          $ref: "#/components/responses/Problem"

  /oidc-clients/{id}/grants:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [OIDC]
      summary: List consent grants for a client
      operationId: listOidcClientGrants
      responses:
        "200":
          description: Consent grants
        default:
          $ref: "#/components/responses/Problem"

  /oidc-clients/{id}/grants/{accountId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [OIDC]
      summary: Admin-revoke a consent grant
      operationId: adminRevokeOidcClientGrant
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Problem"

  /me/oidc-grants:
    get:
      tags: [OIDC]
      summary: List my OIDC consent grants
      description: Session-only. API keys cannot list connected apps.
      operationId: listMyOidcGrants
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Connected apps
        default:
          $ref: "#/components/responses/Problem"

  /me/oidc-grants/{clientId}:
    parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [OIDC]
      summary: Revoke my consent grant
      description: Session-only. API keys cannot revoke connected apps.
      operationId: revokeMyOidcGrant
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Problem"

  /oauth/authorize:
    get:
      tags: [OIDC]
      summary: OAuth authorization endpoint
      operationId: oauthAuthorize
      security: []
      responses:
        "302":
          description: Redirect to login, consent, or client
        default:
          $ref: "#/components/responses/Problem"

  /oauth/token:
    post:
      tags: [OIDC]
      summary: OAuth token endpoint
      operationId: oauthToken
      security: []
      responses:
        "200":
          description: Token response
        default:
          $ref: "#/components/responses/Problem"

  /oauth/jwks:
    get:
      tags: [OIDC]
      summary: JSON Web Key Set
      operationId: oauthJwks
      security: []
      responses:
        "200":
          description: Public ES256 JWKS

  /oauth/userinfo:
    get:
      tags: [OIDC]
      summary: OIDC userinfo
      operationId: oauthUserinfo
      responses:
        "200":
          description: User claims
        default:
          $ref: "#/components/responses/Problem"

  /oauth/pending/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [OIDC]
      summary: Pending authorization for consent UI
      operationId: getOidcPending
      responses:
        "200":
          description: Pending details
        default:
          $ref: "#/components/responses/Problem"

  /oauth/consent:
    post:
      tags: [OIDC]
      summary: Approve or deny pending authorization
      operationId: oauthConsent
      responses:
        "200":
          description: Relaying-party redirect URL
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: flaremail_session
      description: |
        Signed-in web session. HttpOnly, Secure, SameSite=Lax cookie set by
        sign-in, invite activation, MFA verify, and passkey sign-in. Idle
        lifetime is 7 days. Required for session-only operations (API keys,
        MFA, passkeys, sessions, recovery email, and other security surfaces).
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API key or OAuth access token in the `Authorization` header:

        `Authorization: Bearer <token>`

        User API keys start with `fmu_`. Effective access is the holder's
        account permissions intersected with the key's scopes. OAuth access
        tokens are issued by `POST /oauth/token`. API keys cannot call
        session-only endpoints.

  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MailboxId:
      name: mailboxId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MailboxIdQuery:
      name: mailboxId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    Problem:
      description: RFC 9457 problem response
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type URI
          example: /api/v1/problems/validation-error
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Field 'mailboxId' is required
        instance:
          type: string
          format: uri-reference
          example: /api/v1/messages/send
        code:
          type: string
          description: Application-specific error code
          example: validation-error

    HealthStatus:
      type: object
      required: [ok, version]
      properties:
        ok:
          type: boolean
          const: true
        version:
          type: string
          description: Product version from root package.json
          example: 0.9.5

    BootstrapResult:
      type: object
      required: [created]
      properties:
        created:
          type: boolean
        password:
          type: string
          description: Generated intendant password. Present only when created is true.

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    AccountRole:
      type: string
      enum: [user, manager, admin, superadmin]

    AccountStatus:
      type: string
      enum: [pending, active, suspended]

    ProfileLockableField:
      type: string
      enum:
        - firstName
        - lastName
        - recoveryAddress
        - phone
        - addressCountry
        - addressState
        - addressCity
        - addressLine1
        - addressLine2

    ProfileAddress:
      type: object
      properties:
        country:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        line1:
          type: ["string", "null"]
        line2:
          type: ["string", "null"]

    ProfilePayload:
      type: ["object", "null"]
      properties:
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        recoveryAddress:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          $ref: "#/components/schemas/ProfileAddress"

    AccountCapabilities:
      type: object
      properties:
        accessManagementPage:
          type: boolean
        accessAccountsTab:
          type: boolean
        accessOrganizationTab:
          type: boolean
        accessDomainsTab:
          type: boolean
        accessMailboxesTab:
          type: boolean
        manageMailboxes:
          type: boolean
        registerDomains:
          type: boolean
        assignRoles:
          type: boolean
        editOwnProfile:
          type: boolean
        editLocalPartPolicy:
          type: boolean
        manageSharedMailboxUsers:
          type: boolean
        manageUserMailboxGrants:
          type: boolean
        lockProfileFields:
          type: boolean
        manageAssignments:
          type: boolean
        manageManagerMailboxAssignments:
          type: boolean
        showsManagerMailboxGrantsTab:
          type: boolean
        accessTemplatesTab:
          type: boolean
        canCreateGlobalTemplates:
          type: boolean
        accessOidcClientsTab:
          type: boolean
        accessLogsTab:
          type: boolean
        manageableTargetRoles:
          type: array
          items:
            $ref: "#/components/schemas/AccountRole"
        suspendableTargetRoles:
          type: array
          items:
            $ref: "#/components/schemas/AccountRole"
        removableTargetRoles:
          type: array
          items:
            $ref: "#/components/schemas/AccountRole"
        inviteableRoles:
          type: array
          items:
            $ref: "#/components/schemas/AccountRole"

    Me:
      type: object
      required:
        - id
        - isIntendant
        - status
        - loginIdentifier
        - capabilities
        - displayName
      properties:
        id:
          type: string
          format: uuid
        isIntendant:
          type: boolean
        role:
          oneOf:
            - $ref: "#/components/schemas/AccountRole"
            - type: "null"
        status:
          $ref: "#/components/schemas/AccountStatus"
        loginIdentifier:
          type: string
        primaryMailboxId:
          type: ["string", "null"]
          format: uuid
        domainIds:
          type: array
          items:
            type: string
            format: uuid
        lockedFields:
          type: array
          items:
            $ref: "#/components/schemas/ProfileLockableField"
        mfaEnabled:
          type: boolean
        mfaEnabledAt:
          type: ["string", "null"]
          format: date-time
        securityRequirements:
          type: object
          properties:
            recoveryEmail:
              type: boolean
            mfa:
              type: boolean
        organizationPolicies:
          type: object
          properties:
            mfaRequired:
              type: boolean
            recoveryEmailRequired:
              type: boolean
        capabilities:
          $ref: "#/components/schemas/AccountCapabilities"
        profile:
          $ref: "#/components/schemas/ProfilePayload"
        profilePicture:
          $ref: "#/components/schemas/ProfilePicture"
        displayName:
          type: string

    InvitedBy:
      type: ["object", "null"]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        loginIdentifier:
          type: string
        profilePicture:
          $ref: "#/components/schemas/ProfilePicture"
        deleted:
          type: boolean

    AccountListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          oneOf:
            - $ref: "#/components/schemas/AccountRole"
            - type: "null"
        status:
          $ref: "#/components/schemas/AccountStatus"
        loginIdentifier:
          type: string
        primaryMailboxId:
          type: ["string", "null"]
          format: uuid
        isIntendant:
          type: boolean
        domainId:
          type: ["string", "null"]
          format: uuid
        displayName:
          type: string
        profilePicture:
          $ref: "#/components/schemas/ProfilePicture"

    AccountDetail:
      allOf:
        - $ref: "#/components/schemas/AccountListItem"
        - type: object
          properties:
            profile:
              $ref: "#/components/schemas/ProfilePayload"
            lockedFields:
              type: array
              items:
                $ref: "#/components/schemas/ProfileLockableField"
            domainIds:
              type: array
              items:
                type: string
                format: uuid
            allSharedMailboxes:
              type: boolean
            sharedMailboxIds:
              type: array
              items:
                type: string
                format: uuid
            grantedMailboxIds:
              type: array
              items:
                type: string
                format: uuid
            invitedBy:
              $ref: "#/components/schemas/InvitedBy"

    ProfileFieldPatch:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        recoveryAddress:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          $ref: "#/components/schemas/ProfileAddress"
        addressCountry:
          type: ["string", "null"]
        addressState:
          type: ["string", "null"]
        addressCity:
          type: ["string", "null"]
        addressLine1:
          type: ["string", "null"]
        addressLine2:
          type: ["string", "null"]

    SelfProfileUpdate:
      allOf:
        - $ref: "#/components/schemas/ProfileFieldPatch"
        - type: object
          properties:
            profile:
              $ref: "#/components/schemas/ProfileFieldPatch"

    InvitePreview:
      type: object
      required: [address, lockedFields, requireRecoveryEmail]
      properties:
        address:
          type: string
        lockedFields:
          type: array
          items:
            $ref: "#/components/schemas/ProfileLockableField"
        requireRecoveryEmail:
          type: boolean
        profile:
          $ref: "#/components/schemas/ProfilePayload"

    ActivateInviteRequest:
      allOf:
        - $ref: "#/components/schemas/ProfileFieldPatch"
        - type: object
          required: [code, password]
          properties:
            code:
              type: string
            password:
              type: string
              format: password
            profile:
              $ref: "#/components/schemas/ProfileFieldPatch"

    MfaChallenge:
      type: object
      required: [requiresMfa, mfaToken]
      properties:
        requiresMfa:
          type: boolean
          const: true
        mfaToken:
          type: string

    SessionInfo:
      type: object
      required: [id, current, createdAt, lastSeenAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        ipAddress:
          type: ["string", "null"]
        countryCode:
          type: ["string", "null"]
        browser:
          oneOf:
            - type: string
              enum: [Edge, Chrome, Firefox, Safari]
            - type: "null"
        os:
          oneOf:
            - type: string
              enum: [Windows, macOS, Android, iOS, Linux]
            - type: "null"

    SessionRevokeResponse:
      type: object
      required: [ok, signedOutCurrent]
      properties:
        ok:
          type: boolean
          const: true
        signedOutCurrent:
          type: boolean

    Domain:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        isActive:
          type: boolean
        catchAllEnabled:
          type: boolean
        catchAllMailboxId:
          type: ["string", "null"]
          format: uuid
        readiness:
          $ref: "#/components/schemas/DomainReadinessSummary"

    DomainReadinessSummary:
      type: object
      properties:
        badge:
          type: ["string", "null"]
          enum: ["checking", "fail", "healthy", "unhealthy"]
        latestRunId:
          type: ["string", "null"]
          format: uuid
        latestRunStartedAt:
          type: ["string", "null"]
          format: date-time
        latestRunFinishedAt:
          type: ["string", "null"]
          format: date-time

    DomainValidationRunSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [checking, completed, cancelled]
        badge:
          type: string
          enum: [checking, fail, healthy, unhealthy]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time

    DomainValidationCheck:
      type: object
      properties:
        checkKey:
          type: string
          enum: [mx, dmarc_rua, loop_send, loop_receive]
        tier:
          type: string
          enum: [critical, advisory]
        status:
          type: string
          enum: [pending, passed, failed, skipped]
        code:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        checkedAt:
          type: ["string", "null"]
          format: date-time

    DomainValidationLogEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        level:
          type: string
          enum: [info, warning, error]
        stage:
          type: string
          enum: [dns, send, receive, summary]
        code:
          type: ["string", "null"]
        message:
          type: string
        createdAt:
          type: string
          format: date-time

    DomainValidationRunDetail:
      allOf:
        - $ref: "#/components/schemas/DomainValidationRunSummary"
        - type: object
          properties:
            domainId:
              type: string
              format: uuid
            receiveDeadlineAt:
              type: ["string", "null"]
              format: date-time
            checks:
              type: array
              items:
                $ref: "#/components/schemas/DomainValidationCheck"
            logs:
              type: array
              items:
                $ref: "#/components/schemas/DomainValidationLogEvent"

    Mailbox:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domainId:
          type: string
          format: uuid
        address:
          type: string
        type:
          type: string
          enum: [primary, secondary, shared, alias, system, blackhole]
        aliasTargetId:
          type: ["string", "null"]
          format: uuid
        aliasTargetAddress:
          type: ["string", "null"]
        isActive:
          type: boolean
        personalIdentityAllowance:
          type: boolean
          description: >
            Shared mailboxes only. When true, senders may select identities
            owned by their primary mailbox while composing from this mailbox.
        identityExport:
          type: boolean
          description: >
            Shared mailboxes only. When true, this mailbox's identities may be
            selected when sending from other mailboxes the account can access.
        isSystemManaged:
          type: boolean
          description: True for platform-provisioned addresses that cannot be edited or deleted.

    CreateMailboxRequest:
      type: object
      required: [address, domainId, type]
      properties:
        address:
          type: string
        domainId:
          type: string
          format: uuid
        type:
          type: string
          enum: [primary, secondary, shared, alias]
        aliasTargetId:
          type: string
          format: uuid
        aliasTargetAddress:
          type: string

    Label:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mailboxId:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: ["string", "null"]

    IdentityNamePattern:
      type: string
      enum:
        - none
        - first_name
        - last_name
        - first_name_last_name
        - last_name_first_name
        - first_initial_last_name
        - last_name_first_initial
        - first_name_last_initial
        - last_initial_first_name
        - custom

    Identity:
      type: object
      required:
        - id
        - isDefault
        - namePattern
        - fromNamePreview
      properties:
        id:
          type: string
        mailboxId:
          type: ["string", "null"]
          format: uuid
        isDefault:
          type: boolean
        namePattern:
          $ref: "#/components/schemas/IdentityNamePattern"
        customName:
          type: ["string", "null"]
        signatureHtml:
          type: ["string", "null"]
        fromNamePreview:
          type: string
        createdAt:
          type: ["string", "null"]
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time

    IdentityInput:
      type: object
      required: [namePattern]
      properties:
        namePattern:
          $ref: "#/components/schemas/IdentityNamePattern"
        customName:
          type: ["string", "null"]
        signatureHtml:
          type: ["string", "null"]

    IdentityPatch:
      type: object
      properties:
        namePattern:
          $ref: "#/components/schemas/IdentityNamePattern"
        customName:
          type: ["string", "null"]
        signatureHtml:
          type: ["string", "null"]

    IdentityListResponse:
      type: object
      required: [items, capabilities]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
        capabilities:
          type: object
          required: [canManage, customNameAllowed]
          properties:
            canManage:
              type: boolean
            customNameAllowed:
              type: boolean

    AccountIdentitiesOverview:
      type: object
      required: [own, default, shared, capabilities]
      properties:
        own:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
        default:
          oneOf:
            - $ref: "#/components/schemas/Identity"
            - type: "null"
        shared:
          type: array
          items:
            $ref: "#/components/schemas/SharedMailboxIdentitiesGroup"
        capabilities:
          type: object
          required: [canManageOwn, customNameAllowed, primaryMailboxId]
          properties:
            canManageOwn:
              type: boolean
            customNameAllowed:
              type: boolean
            primaryMailboxId:
              type: ["string", "null"]
              format: uuid

    SharedMailboxIdentitiesGroup:
      type: object
      required: [mailboxId, mailboxAddress, identityExport, identities]
      properties:
        mailboxId:
          type: string
          format: uuid
        mailboxAddress:
          type: string
        identityExport:
          type: boolean
          description: >
            When true, these identities may be selected when sending from other
            mailboxes.
        identities:
          type: array
          items:
            $ref: "#/components/schemas/Identity"

    EmailAddress:
      oneOf:
        - type: string
        - type: object
          required: [email]
          properties:
            email:
              type: string
            name:
              type: string

    OutboundAttachmentInput:
      type: object
      required: [filename, mimeType, content]
      properties:
        filename:
          type: string
        mimeType:
          type: string
        content:
          type: string
          description: Base64-encoded file bytes.
        disposition:
          type: string
          enum: [attachment, inline]
        contentId:
          type: string

    OutboundMessageBody:
      type: object
      required: [to, subject]
      properties:
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        subject:
          type: string
        text:
          type: string
        html:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/OutboundAttachmentInput"
        identityId:
          type: string
          description: >
            Identity used for the From name. Signature should already be in the
            body; the server does not re-append it.

    SendMessageRequest:
      allOf:
        - $ref: "#/components/schemas/OutboundMessageBody"
        - type: object
          required: [mailboxId]
          properties:
            mailboxId:
              type: string
              format: uuid

    CreateDraftRequest:
      allOf:
        - $ref: "#/components/schemas/SendMessageRequest"
        - type: object
          properties:
            threadId:
              type: string
              format: uuid
            inReplyToMessageId:
              type: string
              format: uuid
            replyAll:
              type: boolean
              default: false
              description: >
                When replying via draft, include all visible thread participants
                (From, To, Cc, Reply-To) except the sending mailbox. Ignored when
                explicit `to` recipients are provided.

    ReplyRequest:
      type: object
      required: [mailboxId]
      properties:
        mailboxId:
          type: string
          format: uuid
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        subject:
          type: string
          description: >
            Optional. When omitted, defaults to `Re: <parent subject>`. Does not
            prepend another `Re:` when the parent subject already starts with `Re:`.
        text:
          type: string
        html:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/OutboundAttachmentInput"
        replyAll:
          type: boolean
          default: false
        identityId:
          type: string

    ForwardRequest:
      type: object
      required: [mailboxId, to]
      properties:
        mailboxId:
          type: string
          format: uuid
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        subject:
          type: string
          description: >
            Optional. When omitted, defaults to `Fwd: <parent subject>`. Does not
            prepend another `Fwd:` when the parent subject already starts with `Fwd:`.
        text:
          type: string
        html:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/OutboundAttachmentInput"
        includeAttachments:
          type: boolean
          default: true
          description: When true, copies attachments from the forwarded message.
        includeQuotedBody:
          type: boolean
          default: true
          description: >
            When true, appends a quoted copy of the parent message below the optional
            intro text. Set false when the client already included the quote in `text`/`html`.
        identityId:
          type: string

    ThreadMessagePreview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: ["string", "null"]
        preview:
          type: ["string", "null"]
        from:
          type: string
        to:
          type: string
        cc:
          type: ["string", "null"]
        bcc:
          type: ["string", "null"]
        direction:
          type: string
          enum: [inbound, outbound]
        sendStatus:
          type: ["string", "null"]
        hasHtml:
          type: boolean
        hasAttachments:
          type: boolean
        sentAt:
          type: ["string", "null"]
          format: date-time
        receivedAt:
          type: string
          format: date-time
        inReplyTo:
          type: ["string", "null"]
          format: uuid
          description: Parent message id within the thread, when this message is a reply.
        bimiDomain:
          type: ["string", "null"]
          description: >
            Publishing BIMI domain when this message resolved a found logo; null otherwise.
        text:
          type: ["string", "null"]
          description: Present when includeBody=true on list thread messages.
        html:
          type: ["string", "null"]
          description: Present when includeBody=true on list thread messages.
        attachments:
          type: array
          description: Present when includeBody=true on list thread messages.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              filename:
                type: ["string", "null"]
              mimeType:
                type: string
              sizeBytes:
                type: integer
              disposition:
                type: ["string", "null"]
              contentId:
                type: ["string", "null"]
        sentBy:
          type: ["object", "null"]
          description: >
            Present only when viewing a shared mailbox. Internal-only identity of the
            user who sent the outbound message.
          properties:
            accountId:
              type: string
              format: uuid
            loginIdentifier:
              type: string
              format: email
            displayName:
              type: string
            profilePicture:
              $ref: "#/components/schemas/ProfilePicture"
        seenBy:
          type: array
          description: >
            Present only when viewing a shared mailbox. Users who have read this message.
          items:
            $ref: "#/components/schemas/SeenByViewer"

    ThreadMessagesResponse:
      type: object
      properties:
        thread:
          $ref: "#/components/schemas/Thread"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ThreadMessagePreview"

    SendCommandResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        rfcMessageId:
          type: string
        status:
          type: string
          enum: [draft, sending, sent, failed]

    MessagePreview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        subject:
          type: ["string", "null"]
        preview:
          type: ["string", "null"]
        from:
          type: string
        to:
          type: string
        cc:
          type: ["string", "null"]
        bcc:
          type: ["string", "null"]
        direction:
          type: string
          enum: [inbound, outbound]
        sendStatus:
          type: ["string", "null"]
        hasHtml:
          type: boolean
        hasAttachments:
          type: boolean
        sentAt:
          type: ["string", "null"]
          format: date-time
        receivedAt:
          type: string
          format: date-time
        bimiDomain:
          type: ["string", "null"]
          description: >
            Publishing BIMI domain when this message resolved a found logo; null otherwise.

    MessageFull:
      allOf:
        - $ref: "#/components/schemas/MessagePreview"
        - type: object
          properties:
            text:
              type: ["string", "null"]
            html:
              type: ["string", "null"]
            bcc:
              type: ["string", "null"]
            rfcMessageId:
              type: string
            headers:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  value:
                    type: string
            attachments:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  filename:
                    type: ["string", "null"]
                  mimeType:
                    type: string
                  sizeBytes:
                    type: integer

    ThreadFolder:
      type: string
      enum: [inbox, spam, trash, archived, drafts, sent]

    Thread:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: ["string", "null"]
        preview:
          type: ["string", "null"]
        lastMessageAt:
          type: string
          format: date-time
        messageCount:
          type: integer
        isRead:
          type: boolean
        isStarred:
          type: boolean
        folder:
          $ref: "#/components/schemas/ThreadFolder"
        labelIds:
          type: array
          items:
            type: string
            format: uuid
        sender:
          type: ["string", "null"]
          description: From header of the latest message in the thread.
        participants:
          type: array
          description: Unique participant email addresses in the thread, excluding the viewing mailbox.
          items:
            type: string
            format: email
        seenBy:
          type: array
          description: >
            Present only when viewing a shared mailbox. Seen-by list for the latest
            message in the thread.
          items:
            $ref: "#/components/schemas/SeenByViewer"
        bimiDomains:
          type: array
          description: >
            Unique publishing BIMI domains from messages in this thread that have a
            found logo cache entry.
          items:
            type: string

    ProfilePicture:
      type: ["object", "null"]
      properties:
        updatedAt:
          type: string
          format: date-time

    SeenByViewer:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        loginIdentifier:
          type: string
          format: email
        displayName:
          type: string
        profilePicture:
          $ref: "#/components/schemas/ProfilePicture"
        seenAt:
          type: string
          format: date-time

    ThreadPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Thread"
        nextCursor:
          type: ["string", "null"]

    SearchRequest:
      type: object
      required: [mailboxId, query]
      properties:
        mailboxId:
          type: string
          format: uuid
        query:
          type: string
        cursor:
          type: ["string", "null"]
        limit:
          type: integer
          minimum: 1
          maximum: 100

    SearchPage:
      type: object
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/MessagePreview"
              - type: object
                properties:
                  threadId:
                    type: string
                    format: uuid
        nextCursor:
          type: ["string", "null"]

    DraftPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/MessagePreview"
              - type: object
                required: [composeOnly]
                properties:
                  composeOnly:
                    type: boolean
                    description: >
                      True when the draft's thread is in the drafts folder
                      (compose-only / no non-draft messages yet).
                  threadFolder:
                    allOf:
                      - $ref: "#/components/schemas/ThreadFolder"
                    nullable: true
        nextCursor:
          type: ["string", "null"]
